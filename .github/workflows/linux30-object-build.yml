name: Linux 3.0 modified object build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "block/**"
      - "ipc/**"
      - "include/linux/l30_checked_math.h"
      - "windows_verify/**"
      - "ci/**"
      - ".github/workflows/linux30-object-build.yml"

jobs:
  portable-tests:
    name: Portable arithmetic and source tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run native Windows verification
        shell: powershell
        run: .\windows_verify\verify-native.ps1

  kernel-objects:
    name: Build changed Linux 3.0 objects with GCC 4.8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official Linux 3.0 source
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            https://cdn.kernel.org/pub/linux/kernel/v3.0/linux-3.0.tar.xz \
            --output linux-3.0.tar.xz
          tar -xf linux-3.0.tar.xz

      - name: Overlay modified sources
        shell: bash
        run: |
          set -euxo pipefail
          cp block/blk-tag.c linux-3.0/block/blk-tag.c
          cp block/blk-sysfs.c linux-3.0/block/blk-sysfs.c
          cp ipc/mqueue.c linux-3.0/ipc/mqueue.c
          cp ipc/sem.c linux-3.0/ipc/sem.c
          cp ipc/util.c linux-3.0/ipc/util.c
          cp ipc/util.h linux-3.0/ipc/util.h
          cp include/linux/l30_checked_math.h \
             linux-3.0/include/linux/l30_checked_math.h

      # Linux 3.0 selects include/linux/compiler-gcc${__GNUC__}.h.
      # Keep the proof build on the GCC 4.x generation instead of porting the
      # entire 2011 kernel compiler layer merely to compile these five objects.
      # A step-level Docker container is used so actions/checkout@v4 can still
      # run on the modern GitHub runner.
      - name: Build changed objects in Ubuntu 14.04 / GCC 4.8
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:14.04 \
            bash /work/ci/build-linux30-gcc48.sh

      - name: Assemble proof artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof
          cp linux-3.0/block/blk-tag.o proof/
          cp linux-3.0/block/blk-sysfs.o proof/
          cp linux-3.0/ipc/mqueue.o proof/
          cp linux-3.0/ipc/sem.o proof/
          cp linux-3.0/ipc/util.o proof/
          cp changed-objects-build.log proof/
          sha256sum proof/*.o > proof/SHA256SUMS.txt
          test -s proof/blk-tag.o
          test -s proof/blk-sysfs.o
          test -s proof/mqueue.o
          test -s proof/sem.o
          test -s proof/util.o
          cat proof/SHA256SUMS.txt

      - name: Upload compiled proof
        uses: actions/upload-artifact@v4
        with:
          name: linux-3.0-modified-objects-gcc48
          path: proof/
          if-no-files-found: error
