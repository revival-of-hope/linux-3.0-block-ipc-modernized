name: Linux 3.0 refactor verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "block/**"
      - "ipc/**"
      - "include/linux/l30_checked_math.h"
      - "windows_verify/**"
      - "ci/**"
      - ".github/workflows/linux30-object-build.yml"
  push:
    branches:
      - main
    paths:
      - "block/**"
      - "ipc/**"
      - "include/linux/l30_checked_math.h"
      - "windows_verify/**"
      - "ci/**"
      - ".github/workflows/linux30-object-build.yml"

jobs:
  portable-tests:
    name: Portable policy and source-contract tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run native Windows verification
        shell: powershell
        run: .\windows_verify\verify-native.ps1

  kernel-objects:
    name: Build objects and link Linux 3.0 with GCC 4.8.5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official Linux 3.0 source
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            https://cdn.kernel.org/pub/linux/kernel/v3.0/linux-3.0.tar.xz \
            --output linux-3.0.tar.xz
          tar -xf linux-3.0.tar.xz

      - name: Overlay refactored sources
        shell: bash
        run: |
          set -euxo pipefail
          cp block/blk-tag.c linux-3.0/block/blk-tag.c
          cp block/blk-sysfs.c linux-3.0/block/blk-sysfs.c
          cp block/genhd.c linux-3.0/block/genhd.c
          cp block/scsi_ioctl.c linux-3.0/block/scsi_ioctl.c
          cp block/look-iosched.c linux-3.0/block/look-iosched.c
          cp block/look-iosched-policy.h \
             linux-3.0/block/look-iosched-policy.h
          cp block/Kconfig.iosched linux-3.0/block/Kconfig.iosched
          cp block/Makefile linux-3.0/block/Makefile
          cp ipc/Makefile linux-3.0/ipc/Makefile
          cp ipc/alloc.c linux-3.0/ipc/alloc.c
          cp ipc/alloc.h linux-3.0/ipc/alloc.h
          cp ipc/mqueue.c linux-3.0/ipc/mqueue.c
          cp ipc/msgutil.c linux-3.0/ipc/msgutil.c
          cp ipc/sem.c linux-3.0/ipc/sem.c
          cp ipc/util.c linux-3.0/ipc/util.c
          cp ipc/util.h linux-3.0/ipc/util.h
          cp include/linux/l30_checked_math.h \
             linux-3.0/include/linux/l30_checked_math.h

      - name: Build refactored objects in Docker Official gcc:4.8.5
        shell: bash
        run: |
          set -euxo pipefail
          docker pull gcc:4.8.5
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            gcc:4.8.5 \
            bash /work/ci/build-linux30-gcc48.sh

      - name: Re-run source contracts on Linux runner
        shell: bash
        run: python3 windows_verify/source_contract_test.py

      - name: Assemble proof artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof
          for object in \
            block/blk-tag.o \
            block/blk-sysfs.o \
            block/genhd.o \
            block/scsi_ioctl.o \
            block/look-iosched.o \
            block/built-in.o \
            ipc/alloc.o \
            ipc/mqueue.o \
            ipc/msg.o \
            ipc/msgutil.o \
            ipc/sem.o \
            ipc/shm.o \
            ipc/util.o; do
            test -s "linux-3.0/$object"
            cp "linux-3.0/$object" proof/
          done
          test -s linux-3.0/vmlinux
          cp changed-objects-build.log vmlinux-build.log proof/
          cp linux-3.0/.config proof/kernel-config
          sha256sum proof/*.o > proof/SHA256SUMS.txt
          sha256sum linux-3.0/vmlinux > proof/VMLINUX_SHA256SUM.txt
          cat proof/SHA256SUMS.txt
          cat proof/VMLINUX_SHA256SUM.txt

      - name: Upload compiled proof
        uses: actions/upload-artifact@v4
        with:
          name: linux-3.0-refactored-objects-gcc48
          path: proof/
          if-no-files-found: error
